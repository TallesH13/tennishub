# Atualizações automáticas de dependências: o Dependabot abre um Pull Request
# quando há versão nova ou correção de segurança.
version: 2

updates:
  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(app)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'ci'

