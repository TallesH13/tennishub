# Análise estática do app (RNF04).
# Base: flutter_lints. As regras extras deixam o código uniforme entre os integrantes.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - web/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - always_use_package_imports
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - use_super_parameters
